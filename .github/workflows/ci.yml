name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-path: python/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and test Python runtime
        run: |
          cd python
          uv sync --locked --dev
          uv run pytest -q
      - name: Test with optional tracing SDK
        run: |
          cd python
          uv sync --locked --dev --extra tracing
          uv run --extra tracing pytest tests/test_tracing.py -q
      - name: Smoke CLI (mock)
        run: |
          cd python
          uv run judge-jev run --rubric assistant-reply --input ../fixtures/assistant-reply-pass.json --mock

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: clippy, rustfmt
      - name: Format
        run: cd rust && cargo fmt --check
      - name: Lint
        run: cd rust && cargo clippy --all-targets -- -D warnings
      - name: Test Rust runtime
        run: cd rust && cargo test --quiet
      - name: Smoke CLI (mock)
        run: |
          cd rust
          cargo run --quiet -- run --rubric assistant-reply --input ../fixtures/assistant-reply-pass.json --mock

  # The shared rubrics are only shared if both runtimes reach the same verdict from
  # the same input. This is the check that the previous Rust routing would have failed.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-path: python/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.98
      - name: Build both runtimes
        run: |
          cd python && uv sync --locked --dev && cd ..
          cd rust && cargo build --release --quiet
      - name: Runtimes must agree
        run: bash scripts/check-parity.sh

  # Adapter docs drifted into teaching --mock as the default in their primary
  # example once already (issue #5): mock answers are canned, and an integration
  # copied straight from a README that defaults to --mock never judges anything
  # real. This is the same shape of guard as `examples` below and `mergecraft-pin`
  # above, scoped to the one thing that drifted.
  adapter-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adapter docs must not default to --mock
        run: bash scripts/check-adapter-docs.sh

  # The examples are documentation that runs. Mock answers are deterministic, so an
  # example whose verdict drifts away from what its README claims fails here instead
  # of misleading the next person who copies it.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-path: python/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.98
      - name: Build both runtimes
        run: |
          cd python && uv sync --locked --dev && cd ..
          cd rust && cargo build --release --quiet
      - name: Examples behave as documented (python)
        run: JUDGE_JEV_RUNTIME=python bash examples/run-all.sh
      - name: Examples behave as documented (rust)
        run: JUDGE_JEV_RUNTIME=rust bash examples/run-all.sh
      - name: Pipeline handles every exit class before parsing JSON
        run: bash scripts/check-pipeline-example.sh

  # mergeCraft's action pin is written twice in one file: the `uses:` ref, and the
  # MERGECRAFT_ACTION_SHA the container reads because `uses:` is not visible from
  # inside the image. Bump one and not the other and the review still runs, but
  # reports a pin it is not running — the failure upstream guards with
  # `make action-pin-check`. A consumer install inherits none of that tooling, so
  # this is that check, scoped to the one thing that can silently drift.
  mergecraft-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Action ref and MERGECRAFT_ACTION_SHA must agree
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          wf = pathlib.Path(".github/workflows/mergecraft.yml").read_text()
          refs = re.findall(r"uses:\s*alexhawat/mergeCraft@(\S+)", wf)
          envs = re.findall(r"MERGECRAFT_ACTION_SHA:\s*(\S+)", wf)

          if not refs or not envs:
              sys.exit(f"could not find the pin: {len(refs)} uses ref(s), {len(envs)} env value(s)")
          if len(set(refs)) != 1 or len(set(envs)) != 1:
              sys.exit(f"pin is not uniform: uses={sorted(set(refs))} env={sorted(set(envs))}")
          if refs[0] != envs[0]:
              sys.exit(
                  f"half-bumped pin: uses alexhawat/mergeCraft@{refs[0]} "
                  f"but MERGECRAFT_ACTION_SHA={envs[0]}"
              )
          print(f"ok mergeCraft pin: {refs[0]}")
          PY

  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-path: python/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rubrics must match rubric.schema.json
        run: |
          cd python
          uv sync --locked --dev
          uv run python - <<'PY'
          import json, pathlib, yaml, jsonschema
          root = pathlib.Path("..")
          schema = json.loads((root / "shared/schemas/rubric.schema.json").read_text())
          for path in sorted((root / "shared/rubrics").glob("*.yaml")):
              jsonschema.validate(yaml.safe_load(path.read_text()), schema)
              print(f"ok {path.name}")
          PY
      - name: Packaged Rust assets must match shared sources
        run: bash scripts/check-bundled-assets.sh
