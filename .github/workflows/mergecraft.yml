name: mergeCraft

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      prompt:
        description: Prompt for the agent
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write
  actions: read

jobs:
  mergecraft:
    # CONTRIBUTING.md: a workflow that needs secrets gates on same-repo heads.
    # A fork's pull_request head receives no secrets, so without this the job
    # runs, finds no credential, and fails instead of skipping. Matches the gate
    # mergeCraft's own workflow puts on every rung.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run mergeCraft
        uses: alexhawat/mergeCraft@v0.1.0a1
        with:
          prompt: >
            ${{ github.event_name == 'pull_request'
                && 'Review this pull request.'
                || github.event.inputs.prompt }}
          model: openai/gpt-terra
          status_checks: enabled
        env:
          # The pin the job actually runs (manifest commit C). The container can
          # only learn it from here — `uses:` is not visible inside the image —
          # and resolve_action_pin_sha() reads exactly this name. Without it a
          # consumer install records an empty pin and cannot report a pin/image
          # mismatch (#641). Keep it equal to the `uses:` SHA above.
          MERGECRAFT_ACTION_SHA: v0.1.0a1
          # ChatGPT through the Codex harness, the same rung mergeCraft's own
          # repo runs (openai/gpt-terra, CODEX_AUTH_JSON + OPENAI_API_KEY).
          #
          # Four spellings, all of them alternatives rather than requirements —
          # an unset secret renders as an empty string and the resolver skips it.
          # `mergecraft provider auth openai --scope github` stores the INDEXED
          # name (openai is envIndex 8 in .mergecraft/config.yaml); the flat
          # names are what a hand-set secret or an API key uses. Wiring all four
          # means the subscription path and the API-key path both work without
          # editing this file again.
          LLM_PROVIDER_8_CODEX_AUTH_JSON: ${{ secrets.LLM_PROVIDER_8_CODEX_AUTH_JSON }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          LLM_PROVIDER_8_API_KEY: ${{ secrets.LLM_PROVIDER_8_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
