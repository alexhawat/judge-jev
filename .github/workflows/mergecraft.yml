name: mergeCraft

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      prompt:
        description: Prompt for the agent
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write
  actions: read

jobs:
  mergecraft:
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run mergeCraft
        uses: alexhawat/mergeCraft@v0.1.0a1
        with:
          prompt: >
            ${{ github.event_name == 'pull_request'
                && 'Review this pull request.'
                || github.event.inputs.prompt }}
          model: anthropic/claude-sonnet
          status_checks: enabled
        env:
          # The pin the job actually runs (manifest commit C). The container can
          # only learn it from here — `uses:` is not visible inside the image —
          # and resolve_action_pin_sha() reads exactly this name. Without it a
          # consumer install records an empty pin and cannot report a pin/image
          # mismatch (#641). Keep it equal to the `uses:` SHA above.
          MERGECRAFT_ACTION_SHA: v0.1.0a1
          # `mergecraft provider auth anthropic --scope github` stores the INDEXED
          # secret (LLM_PROVIDER_<envIndex>_…, envIndex 1 for anthropic in
          # .mergecraft/config.yaml). The flat spelling is what a hand-set secret
          # uses. Both are accepted credential env names, and an unset secret
          # renders empty and is skipped, so passing both means either path works.
          LLM_PROVIDER_1_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.LLM_PROVIDER_1_CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
