name: Deploy funnel preview to GitHub Pages

on:
  push:
    branches:
      - pages/funnel-preview
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: funnel-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/funnel/package-lock.json

      - name: Install and build funnel app
        working-directory: web/funnel
        run: |
          npm ci
          npm run build

      # Publishes to gh-pages branch under funnel/ →
      # https://alexhawat.github.io/judge-jev/funnel/
      # One-time repo setting: Settings → Pages → Source = Deploy from branch → gh-pages / (root)
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/funnel/dist
          publish_branch: gh-pages
          destination_dir: funnel
          force_orphan: true
