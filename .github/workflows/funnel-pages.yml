name: Deploy funnel preview to GitHub Pages

on:
  push:
    branches:
      - pages/funnel-preview
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: funnel-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/funnel/package-lock.json

      - name: Install and build funnel app (v2)
        working-directory: web/funnel
        run: |
          npm ci
          npm run build

      - name: Prepare gh-pages tree with v2 + redirect
        run: |
          mkdir -p deploy-root/funnel/v2
          cp -r web/funnel/dist/* deploy-root/funnel/v2/
          cat > deploy-root/funnel/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta http-equiv="refresh" content="0;url=v2/" />
              <meta http-equiv="Cache-Control" content="no-cache" />
              <title>Redirecting to funnel v2…</title>
              <link rel="canonical" href="v2/" />
            </head>
            <body>
              <p><a href="v2/">Open judge-jev funnel v2</a></p>
            </body>
          </html>
          HTML

      # https://alexhawat.github.io/judge-jev/funnel/v2/
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy-root
          publish_branch: gh-pages
          force_orphan: true
