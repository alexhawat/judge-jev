[package]
name = "judge-jev"
version = "0.1.0"
edition = "2021"
description = "Jev-native judge for LLM outputs (Rust runtime)"
license = "MIT"

[[bin]]
name = "judge-jev"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
minreq = { version = "2.11", default-features = false, features = ["json-using-serde", "https"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
