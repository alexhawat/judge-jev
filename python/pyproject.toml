[project]
name = "judge-jev"
version = "0.1.0"
description = "Jev-native judge for LLM outputs (Python runtime)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7.0",
    "pyyaml>=6.0",
    "typesafe-sdk>=0.7.0",
]

[project.optional-dependencies]
tracing = [
    "logfire>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.0",
]

[project.scripts]
judge-jev = "judge_jev.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judge_jev"]

[tool.hatch.build.targets.wheel.force-include]
"../shared/rubrics" = "judge_jev/assets/rubrics"
"../shared/schemas" = "judge_jev/assets/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
